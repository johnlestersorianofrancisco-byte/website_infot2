<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | John Lester</title>
<link rel="stylesheet" href="style.css">
<script src="site.js"></script>
</head>
<body>
<header><h1>Contact Me</h1><p>Send a message through this sample contact form.</p></header>
<main class="container">
<div class="section-title"><h2>Let's <span>Connect</span></h2><p>This is a front-end school project, so the form displays a confirmation instead of sending an actual email.</p></div>
<form class="contact-form" id="contactForm">
<input id="contactName" type="text" placeholder="Your name" aria-label="Your name" required>
<input id="contactEmail" type="email" placeholder="Your email" aria-label="Your email" required>
<textarea id="contactMessage" placeholder="Your message" aria-label="Your message" required></textarea>
<button class="btn" type="submit">Send message</button>
<p id="contactResult" role="status" style="text-align:center;"></p>
</form>
</main>
<footer>© 2026 John Lester Francisco</footer>
<script>
document.getElementById("contactForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const result = document.getElementById("contactResult");
    result.textContent = "Thank you! Your message has been received for this demo.";
    result.style.color = "#a8e63d";
    this.reset();
});
</script>
</body>
</html>
