
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | John Lester</title>
    <link rel="stylesheet" href="style.css">
    <script src="site.js"></script>

    <style>
        /* Slideshow */
        .slideshow {
            position: relative;
            max-width: 800px;
            margin: 25px auto;
            overflow: hidden;
            border-radius: 15px;
            background: #0d1422;
        }

        .slide {
            display: none;
            width: 100%;
        }

        .slide.active {
            display: block;
            animation: fadeEffect 0.6s ease;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 420px;
            object-fit: contain;
            cursor: pointer;
        }

        .slide-caption {
            color: white;
            text-align: center;
            padding: 12px;
            background: #0d1422;
        }

        .slide-btn {
            position: absolute;
            top: 45%;
            border: none;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 22px;
            cursor: pointer;
            border-radius: 5px;
        }

        .slide-btn:hover {
            background: var(--blue);
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .slide-dots {
            text-align: center;
            margin: 15px 0 25px;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin: 5px;
            background: #aaa;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .dot.active {
            background: var(--blue);
        }

        .gallery {
            margin-top: 30px;
        }

        @keyframes fadeEffect {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .slide img {
                height: 260px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>My Gallery</h1>
    <p>My projects and personal moments.</p>
</header>

<main class="container">

    <div class="section-title">
        <h2>My <span>Slideshow</span></h2>
        <p>Enjoy my personal pictures and memorable moments.</p>
    </div>

    <!-- Automatic Slideshow -->
    <div class="slideshow" id="slideshow">

        <div class="slide active">
            <img src="IMAGES/ddadad.jpg" alt="Gallery image 1">
            <div class="slide-caption">My Picture 1</div>
        </div>

        <div class="slide">
            <img src="IMAGES/fsfsssd.jpg" alt="Gallery image 2">
            <div class="slide-caption">My Picture 2</div>
        </div>

        <div class="slide">
            <img src="IMAGES/geeg.jpg" alt="Gallery image 3">
            <div class="slide-caption">My Picture 3</div>
        </div>

        <div class="slide">
            <img src="IMAGES/wwww.jpg" alt="Gallery image 4">
            <div class="slide-caption">My Picture 4</div>
        </div>

        <div class="slide">
            <img src="IMAGES/giiggigi.jpg" alt="Gallery image 5">
            <div class="slide-caption">My Picture 5</div>
        </div>

        <div class="slide">
            <img src="IMAGES/vvvv.jpg" alt="Gallery image 6">
            <div class="slide-caption">My Picture 6</div>
        </div>

        <button class="slide-btn prev" id="prevSlide"
                type="button" aria-label="Previous picture">&#10094;</button>

        <button class="slide-btn next" id="nextSlide"
                type="button" aria-label="Next picture">&#10095;</button>
    </div>

    <!-- Slideshow Dots -->
    <div class="slide-dots" id="slideDots"></div>

    <!-- All Pictures -->
    <div class="section-title">
        <h2>All My <span>Pictures</span></h2>
        <p>Click any picture to view it larger.</p>
    </div>

    <div class="gallery">
        <img src="IMAGES/ddadad.jpg" alt="Gallery image 1">
        <img src="IMAGES/fsfsssd.jpg" alt="Gallery image 2">
        <img src="IMAGES/geeg.jpg" alt="Gallery image 3">
        <img src="IMAGES/wwww.jpg" alt="Gallery image 4">
        <img src="IMAGES/giiggigi.jpg" alt="Gallery image 5">
        <img src="IMAGES/vvvv.jpg" alt="Gallery image 6">
    </div>

</main>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox">
    <button id="closeBox" type="button" aria-label="Close image">&times;</button>
    <img id="lightboxImage" src="" alt="Selected image">
</div>

<footer>
    My photos • My projects • My journey
</footer>

<script>
    // SLIDESHOW
    const slides = document.querySelectorAll(".slide");
    const dotsContainer = document.getElementById("slideDots");

    let currentSlide = 0;
    let slideshowTimer;

    // Create one dot for each slide
    slides.forEach((slide, index) => {
        const dot = document.createElement("button");

        dot.type = "button";
        dot.className = "dot";
        dot.setAttribute("aria-label", "Show picture " + (index + 1));

        dot.addEventListener("click", () => {
            showSlide(index);
            restartSlideshow();
        });

        dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll(".dot");

    function showSlide(index) {
        slides[currentSlide].classList.remove("active");
        dots[currentSlide].classList.remove("active");

        currentSlide = (index + slides.length) % slides.length;

        slides[currentSlide].classList.add("active");
        dots[currentSlide].classList.add("active");
    }

    function nextSlide() {
        showSlide(currentSlide + 1);
    }

    function previousSlide() {
        showSlide(currentSlide - 1);
    }

    function startSlideshow() {
        slideshowTimer = setInterval(nextSlide, 3000);
    }

    function restartSlideshow() {
        clearInterval(slideshowTimer);
        startSlideshow();
    }

    document.getElementById("nextSlide").addEventListener("click", () => {
        nextSlide();
        restartSlideshow();
    });

    document.getElementById("prevSlide").addEventListener("click", () => {
        previousSlide();
        restartSlideshow();
    });

    // Start with the first picture
    dots[0].classList.add("active");
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) startSlideshow();

    // Pause automatic slideshow when the pointer is over it
    const slideshow = document.getElementById("slideshow");

    slideshow.addEventListener("mouseenter", () => {
        clearInterval(slideshowTimer);
    });

    slideshow.addEventListener("mouseleave", () => {
        clearInterval(slideshowTimer);
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) startSlideshow();
    });

    // LIGHTBOX: click a picture to enlarge it
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    document.querySelectorAll(".gallery img, .slide img").forEach(img => {
        img.addEventListener("click", () => {
            lightboxImage.src = img.src;
            lightboxImage.alt = img.alt;
            lightbox.classList.add("show");
        });
    });

    document.getElementById("closeBox").addEventListener("click", () => {
        lightbox.classList.remove("show");
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") lightbox.classList.remove("show");
    });

    lightbox.addEventListener("click", event => {
        if (event.target === lightbox) {
            lightbox.classList.remove("show");
        }
    });

</script>

</body>
</html>
